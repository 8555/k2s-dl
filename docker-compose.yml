name: k2s-dl

services:
  captchasolver:
    build: ./captchasolver
    container_name: captchasolver
    restart: unless-stopped
    init: true
    ports:
      - "9955:9955"

  downloader:
    build: ./downloader
    container_name: downloader
    restart: unless-stopped
    init: true
    user: "1000:1000"
    depends_on:
      - captchasolver
    network_mode: host
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /path/to/links.txt:/links.txt:ro
      - /path/to/downloads:/output
